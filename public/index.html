<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrition Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍎 Nutrition Scanner</h1>
    <p>Scan nutrition labels, track your meals, and stay healthy</p>
  </header>

  <main>
    <!-- Settings Section -->
    <section id="settings-section" class="card">
      <h2>⚙️ Settings</h2>
      <div class="form-group">
        <label for="api-key">OpenAI-compatible API Key:</label>
        <input type="password" id="api-key" placeholder="Enter your API key">
      </div>
      <div class="form-group">
        <label for="api-url">API Endpoint URL:</label>
        <input type="text" id="api-url" value="https://api.openai.com/v1/chat/completions" placeholder="https://api.openai.com/v1/chat/completions">
      </div>
      <button id="save-settings-btn" class="btn btn-primary">Save Settings</button>
    </section>

    <!-- Scan Section -->
    <section id="scan-section" class="card">
      <h2>📸 Scan Nutrition Label</h2>
      <div class="form-group">
        <label for="image-input">Upload or capture a photo:</label>
        <input type="file" id="image-input" accept="image/*" capture="environment">
      </div>
      <div id="image-preview-container" class="hidden">
        <img id="image-preview" alt="Preview">
      </div>
      <button id="scan-btn" class="btn btn-primary" disabled>Scan Label</button>
      <div id="scan-status" class="status hidden"></div>
      <div id="ocr-result" class="result hidden"></div>
    </section>

    <!-- Parsed Results Section -->
    <section id="results-section" class="card hidden">
      <h2>📊 Parsed Nutrition Data</h2>
      <div id="product-name-display"></div>
      <div id="serving-info-display"></div>
      <table id="nutrients-table">
        <thead>
          <tr>
            <th>Nutrient</th>
            <th>Per Serving</th>
          </tr>
        </thead>
        <tbody id="nutrients-body"></tbody>
      </table>
      <button id="save-product-btn" class="btn btn-primary">Save Product</button>
    </section>

    <!-- Products List -->
    <section id="products-section" class="card">
      <h2>📦 Saved Products</h2>
      <div id="products-list"></div>
    </section>

    <!-- Meal Planner -->
    <section id="meal-section" class="card">
      <h2>🍽️ Meal Planner</h2>
      <div class="form-group">
        <label for="meal-name">Meal Name:</label>
        <input type="text" id="meal-name" placeholder="Breakfast, Lunch, Dinner...">
      </div>
      <div class="form-group">
        <label for="meal-product">Select Product:</label>
        <select id="meal-product">
          <option value="">-- Select a product --</option>
        </select>
      </div>
      <div class="form-group">
        <label for="meal-grams">Amount (grams):</label>
        <input type="number" id="meal-grams" placeholder="e.g., 60" min="0">
      </div>
      <button id="add-meal-item-btn" class="btn btn-secondary">Add to Meal</button>
      <div id="meal-items-list"></div>
      <button id="save-meal-btn" class="btn btn-primary">Save Meal</button>
    </section>

    <!-- Daily Total -->
    <section id="daily-section" class="card hidden">
      <h2>📈 Daily Total</h2>
      <table id="daily-table">
        <thead>
          <tr>
            <th>Nutrient</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="daily-body"></tbody>
      </table>
    </section>

    <!-- Export/Import -->
    <section id="data-section" class="card">
      <h2>💾 Data Management</h2>
      <button id="export-btn" class="btn btn-secondary">Export Data</button>
      <button id="import-btn" class="btn btn-secondary">Import Data</button>
      <div id="import-result" class="status hidden"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
